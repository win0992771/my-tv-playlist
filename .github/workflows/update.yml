name: Auto Update Playlist

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi pycryptodome

      - name: Run script to generate playlist
        run: python generate_playlist.py

      - name: Commit and push updated playlist
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          touch playlist.m3u8
          git add playlist.m3u8
          git commit -m "Auto-updated playlist" || exit 0
          git push
