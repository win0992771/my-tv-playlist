name: Auto Update Playlist

on:
  schedule:
    - cron: '0 * * * *'   # يعمل تلقائياً كل ساعة
  workflow_dispatch:      # يسمح لك بتشغيله يدوياً بضغطة زر

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome

      - name: Run script to generate playlist
        run: python generate_playlist.py

      - name: Commit and push updated playlist
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add playlist.m3u8
          git commit -m "Auto-updated playlist" || exit 0
          git push
